name: DMM QA

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmm-qa-report
          path: qa-reports/
