services:
  dmm:
    build: .
    container_name: dmm
    restart: unless-stopped
    init: true
    env_file:
      - .env
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      com.aquiero.service: "dmm"
      com.aquiero.role: "direct-model-management"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
